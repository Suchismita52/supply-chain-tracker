<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Chain Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
<style>
  :root {
    --ink: #0d1520;
    --panel: #131d2b;
    --panel-line: #223146;
    --paper: #e9ecf1;
    --dim: #7d8ea3;
    --amber: #d8912f;
    --green: #4f9d69;
    --red: #c15b4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #root { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--panel-line);
    padding-bottom: 20px;
    margin-bottom: 32px;
  }
  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--amber);
    text-transform: uppercase;
  }
  h1 { margin: 4px 0 0; font-size: 26px; font-weight: 600; }
  button.connect {
    background: var(--amber);
    color: #1a1206;
    border: none;
    padding: 10px 18px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
  }
  button.connect:disabled { opacity: 0.6; cursor: default; }
  .acct { font-family: 'Courier New', monospace; font-size: 12px; color: var(--dim); text-align: right; margin-top: 6px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    padding: 22px 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--dim);
    font-weight: 600;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--panel-line);
    color: var(--paper);
    padding: 9px 10px;
    border-radius: 3px;
    font-size: 14px;
  }
  input:focus { outline: 1px solid var(--amber); border-color: var(--amber); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button.action {
    margin-top: 16px;
    background: transparent;
    border: 1px solid var(--amber);
    color: var(--amber);
    padding: 9px 16px;
    border-radius: 3px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }
  button.action:hover { background: var(--amber); color: #1a1206; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .msg { font-family: 'Courier New', monospace; font-size: 12px; margin-top: 12px; min-height: 16px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }
  .msg.pending { color: var(--dim); }
  .timeline { margin-top: 10px; border-left: 2px solid var(--panel-line); padding-left: 16px; }
  .entry { margin-bottom: 16px; position: relative; }
  .entry::before {
    content: '';
    position: absolute;
    left: -21px;
    top: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
  }
  .entry .label { font-weight: 600; font-size: 14px; }
  .entry .meta { font-family: 'Courier New', monospace; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .addr-input { font-family: 'Courier New', monospace; font-size: 11px; padding: 6px 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const ABI = [
  "function addProduct(uint256 _id, string _name) public",
  "function updateStatus(uint256 _id, string _status) public",
  "function getHistory(uint256 _id) public view returns (tuple(string status, uint256 timestamp, address updatedBy)[])",
  "function products(uint256) public view returns (uint256 id, string name, string status, address currentOwner)",
  "function owner() public view returns (address)"
];

function App() {
  const [account, setAccount] = useState(null);
  const [contractAddr, setContractAddr] = useState('');
  const [addId, setAddId] = useState('');
  const [addName, setAddName] = useState('');
  const [addMsg, setAddMsg] = useState({ text: '', kind: '' });
  const [updId, setUpdId] = useState('');
  const [updStatus, setUpdStatus] = useState('');
  const [updMsg, setUpdMsg] = useState({ text: '', kind: '' });
  const [lookupId, setLookupId] = useState('');
  const [lookupMsg, setLookupMsg] = useState({ text: '', kind: '' });
  const [history, setHistory] = useState([]);

  async function connectWallet() {
    if (!window.ethereum) {
      setAddMsg({ text: 'MetaMask not detected', kind: 'err' });
      return;
    }
    const provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    const signer = await provider.getSigner();
    const addr = await signer.getAddress();
    setAccount(addr);
  }

  async function getContract() {
    if (!contractAddr.trim()) throw new Error('Enter the deployed contract address first');
    if (!account) throw new Error('Connect your wallet first');
    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();
    return new ethers.Contract(contractAddr.trim(), ABI, signer);
  }

  async function handleAddProduct() {
    try {
      if (!addId || !addName) throw new Error('Fill in both fields');
      const c = await getContract();
      setAddMsg({ text: 'Confirm the transaction in your wallet...', kind: 'pending' });
      const tx = await c.addProduct(addId, addName);
      setAddMsg({ text: 'Waiting for confirmation...', kind: 'pending' });
      await tx.wait();
      setAddMsg({ text: `Product #${addId} registered. Tx: ${tx.hash.slice(0, 10)}...`, kind: 'ok' });
    } catch (e) {
      setAddMsg({ text: e.reason || e.message, kind: 'err' });
    }
  }

  async function handleUpdateStatus() {
    try {
      if (!updId || !updStatus) throw new Error('Fill in both fields');
      const c = await getContract();
      setUpdMsg({ text: 'Confirm the transaction in your wallet...', kind: 'pending' });
      const tx = await c.updateStatus(updId, updStatus);
      setUpdMsg({ text: 'Waiting for confirmation...', kind: 'pending' });
      await tx.wait();
      setUpdMsg({ text: `Status updated. Tx: ${tx.hash.slice(0, 10)}...`, kind: 'ok' });
    } catch (e) {
      setUpdMsg({ text: e.reason || e.message, kind: 'err' });
    }
  }

  async function handleLookup() {
    try {
      if (!lookupId) throw new Error('Enter a product ID');
      const c = await getContract();
      setLookupMsg({ text: 'Fetching...', kind: 'pending' });
      const result = await c.getHistory(lookupId);
      if (result.length === 0) {
        setLookupMsg({ text: 'No history found for this ID', kind: 'err' });
        setHistory([]);
        return;
      }
      setLookupMsg({ text: `${result.length} record(s) found`, kind: 'ok' });
      setHistory(result.map(entry => ({
        status: entry.status,
        date: new Date(Number(entry.timestamp) * 1000).toLocaleString(),
        updatedBy: entry.updatedBy
      })));
    } catch (e) {
      setLookupMsg({ text: e.reason || e.message, kind: 'err' });
      setHistory([]);
    }
  }

  return (
    <div>
      <header>
        <div>
          <div className="eyebrow">On-chain ledger</div>
          <h1>Supply Chain Tracker</h1>
        </div>
        <div>
          <button className="connect" onClick={connectWallet} disabled={!!account}>
            {account ? 'Connected' : 'Connect Wallet'}
          </button>
          {account && (
            <div className="acct">{account.slice(0, 6)}...{account.slice(-4)}</div>
          )}
        </div>
      </header>

      <div className="card">
        <h2>Contract</h2>
        <label>Deployed address (Sepolia)</label>
        <input
          className="addr-input"
          placeholder="0x..."
          value={contractAddr}
          onChange={e => setContractAddr(e.target.value)}
        />
      </div>

      <div className="card">
        <h2>Add Product</h2>
        <div className="row">
          <div>
            <label>Product ID</label>
            <input type="number" placeholder="1" value={addId} onChange={e => setAddId(e.target.value)} />
          </div>
          <div>
            <label>Name</label>
            <input placeholder="Wireless Mouse" value={addName} onChange={e => setAddName(e.target.value)} />
          </div>
        </div>
        <button className="action" onClick={handleAddProduct}>Register Product</button>
        <div className={`msg ${addMsg.kind}`}>{addMsg.text}</div>
      </div>

      <div className="card">
        <h2>Update Status</h2>
        <div className="row">
          <div>
            <label>Product ID</label>
            <input type="number" placeholder="1" value={updId} onChange={e => setUpdId(e.target.value)} />
          </div>
          <div>
            <label>New status</label>
            <input placeholder="Shipped" value={updStatus} onChange={e => setUpdStatus(e.target.value)} />
          </div>
        </div>
        <button className="action" onClick={handleUpdateStatus}>Update Status</button>
        <div className={`msg ${updMsg.kind}`}>{updMsg.text}</div>
      </div>

      <div className="card">
        <h2>Lookup History</h2>
        <label>Product ID</label>
        <input type="number" placeholder="1" value={lookupId} onChange={e => setLookupId(e.target.value)} />
        <button className="action" onClick={handleLookup}>Get History</button>
        <div className={`msg ${lookupMsg.kind}`}>{lookupMsg.text}</div>
        <div className="timeline">
          {history.map((entry, i) => (
            <div className="entry" key={i}>
              <div className="label">{entry.status}</div>
              <div className="meta">{entry.date} · {entry.updatedBy.slice(0, 6)}...{entry.updatedBy.slice(-4)}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
