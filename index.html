<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Chain Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
<style>
  :root {
    --ink: #0d1520;
    --panel: #131d2b;
    --panel-line: #223146;
    --paper: #e9ecf1;
    --dim: #7d8ea3;
    --amber: #d8912f;
    --green: #4f9d69;
    --red: #c15b4f;
    --blue: #5b9bd5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: 'Segoe UI', system-ui, sans-serif; }
  #root { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--panel-line); padding-bottom: 20px; margin-bottom: 28px; }
  .eyebrow { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 3px; color: var(--amber); text-transform: uppercase; }
  h1 { margin: 4px 0 0; font-size: 26px; font-weight: 600; }
  button.connect { background: var(--amber); color: #1a1206; border: none; padding: 10px 18px; font-weight: 600; border-radius: 3px; cursor: pointer; font-size: 13px; }
  button.connect:disabled { opacity: 0.6; cursor: default; }
  .acct { font-family: 'Courier New', monospace; font-size: 12px; color: var(--dim); text-align: right; margin-top: 6px; }
  .role-badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; margin-top: 4px; }
  .role-Manufacturer { background: #2c4a2f; color: #8fd39c; }
  .role-Distributor { background: #2c3a4a; color: #8fbedd; }
  .role-Retailer { background: #4a3a2c; color: #ddb98f; }
  .role-Admin { background: #4a2c40; color: #dd8fc9; }
  .role-None { background: #333; color: #999; }
  .card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 4px; padding: 22px 24px; margin-bottom: 20px; }
  .card h2 { margin: 0 0 16px; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input, select { width: 100%; background: var(--ink); border: 1px solid var(--panel-line); color: var(--paper); padding: 9px 10px; border-radius: 3px; font-size: 14px; font-family: inherit; }
  input:focus, select:focus { outline: 1px solid var(--amber); border-color: var(--amber); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button.action { margin-top: 16px; background: transparent; border: 1px solid var(--amber); color: var(--amber); padding: 9px 16px; border-radius: 3px; cursor: pointer; font-weight: 600; font-size: 13px; }
  button.action:hover { background: var(--amber); color: #1a1206; }
  button.action.secondary { border-color: var(--blue); color: var(--blue); }
  button.action.secondary:hover { background: var(--blue); color: #0d1520; }
  .msg { font-family: 'Courier New', monospace; font-size: 12px; margin-top: 12px; min-height: 16px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }
  .msg.pending { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid var(--panel-line); }
  th { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .status-pill { font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 600; }
  .status-Manufactured { background: #2c4a2f; color: #8fd39c; }
  .status-Shipped { background: #2c3a4a; color: #8fbedd; }
  .status-Delivered { background: #4a3a2c; color: #ddb98f; }
  .timeline { margin-top: 10px; border-left: 2px solid var(--panel-line); padding-left: 16px; }
  .entry { margin-bottom: 14px; position: relative; }
  .entry::before { content: ''; position: absolute; left: -21px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  .entry .label { font-weight: 600; font-size: 14px; }
  .entry .meta { font-family: 'Courier New', monospace; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .addr-input { font-family: 'Courier New', monospace; font-size: 11px; padding: 6px 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { padding: 8px 16px; border-radius: 3px; border: 1px solid var(--panel-line); color: var(--dim); cursor: pointer; font-size: 13px; font-weight: 600; background: transparent; }
  .tab.active { border-color: var(--amber); color: var(--amber); }
  .empty { color: var(--dim); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const ABI = [
  "function addProduct(uint256 _id, string _name) public",
  "function markShipped(uint256 _id) public",
  "function markDelivered(uint256 _id) public",
  "function assignRole(address _user, uint8 _role) public",
  "function getHistory(uint256 _id) public view returns (tuple(string status, uint256 timestamp, address updatedBy)[])",
  "function getProduct(uint256 _id) public view returns (tuple(uint256 id, string name, string status, address currentHandler, bool exists))",
  "function getAllProductIds() public view returns (uint256[])",
  "function getMyRole() public view returns (uint8)",
  "function admin() public view returns (address)"
];

const ROLE_NAMES = ['None', 'Manufacturer', 'Distributor', 'Retailer'];

function App() {
  const [account, setAccount] = useState(null);
  const [contractAddr, setContractAddr] = useState('');
  const [myRole, setMyRole] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [products, setProducts] = useState([]);
  const [tab, setTab] = useState('dashboard');

  const [addId, setAddId] = useState('');
  const [addName, setAddName] = useState('');
  const [addMsg, setAddMsg] = useState({ text: '', kind: '' });

  const [actionId, setActionId] = useState('');
  const [actionMsg, setActionMsg] = useState({ text: '', kind: '' });

  const [roleAddr, setRoleAddr] = useState('');
  const [roleValue, setRoleValue] = useState('1');
  const [roleMsg, setRoleMsg] = useState({ text: '', kind: '' });

  const [lookupId, setLookupId] = useState('');
  const [lookupMsg, setLookupMsg] = useState({ text: '', kind: '' });
  const [history, setHistory] = useState([]);

  async function connectWallet() {
    if (!window.ethereum) {
      setAddMsg({ text: 'MetaMask not detected', kind: 'err' });
      return;
    }
    const provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    const signer = await provider.getSigner();
    const addr = await signer.getAddress();
    setAccount(addr);
  }

  async function getContract() {
    if (!contractAddr.trim()) throw new Error('Enter the deployed contract address first');
    if (!account) throw new Error('Connect your wallet first');
    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();
    return new ethers.Contract(contractAddr.trim(), ABI, signer);
  }

  async function refreshRoleAndAdmin() {
    try {
      const c = await getContract();
      const role = await c.getMyRole();
      setMyRole(Number(role));
      const adminAddr = await c.admin();
      setIsAdmin(adminAddr.toLowerCase() === account.toLowerCase());
    } catch (e) { /* silent until contract address is filled in */ }
  }

  async function refreshProducts() {
    try {
      const c = await getContract();
      const ids = await c.getAllProductIds();
      const list = [];
      for (const id of ids) {
        const p = await c.getProduct(id);
        list.push({ id: Number(p.id), name: p.name, status: p.status, handler: p.currentHandler });
      }
      setProducts(list);
    } catch (e) { /* silent */ }
  }

  useEffect(() => {
    if (account && contractAddr.trim()) {
      refreshRoleAndAdmin();
      refreshProducts();
    }
  }, [account, contractAddr]);

  async function handleAddProduct() {
    try {
      if (!addId || !addName) throw new Error('Fill in both fields');
      const c = await getContract();
      setAddMsg({ text: 'Confirm the transaction in your wallet...', kind: 'pending' });
      const tx = await c.addProduct(addId, addName);
      setAddMsg({ text: 'Waiting for confirmation...', kind: 'pending' });
      await tx.wait();
      setAddMsg({ text: `Product #${addId} registered. Tx: ${tx.hash.slice(0, 10)}...`, kind: 'ok' });
      refreshProducts();
    } catch (e) {
      setAddMsg({ text: e.reason || e.message, kind: 'err' });
    }
  }

  async function handleMarkShipped() {
    try {
      if (!actionId) throw new Error('Enter a product ID');
      const c = await getContract();
      setActionMsg({ text: 'Confirm the transaction...', kind: 'pending' });
      const tx = await c.markShipped(actionId);
      await tx.wait();
      setActionMsg({ text: `Marked shipped. Tx: ${tx.hash.slice(0, 10)}...`, kind: 'ok' });
      refreshProducts();
    } catch (e) {
      setActionMsg({ text: e.reason || e.message, kind: 'err' });
    }
  }

  async function handleMarkDelivered() {
    try {
      if (!actionId) throw new Error('Enter a product ID');
      const c = await getContract();
      setActionMsg({ text: 'Confirm the transaction...', kind: 'pending' });
      const tx = await c.markDelivered(actionId);
      await tx.wait();
      setActionMsg({ text: `Marked delivered. Tx: ${tx.hash.slice(0, 10)}...`, kind: 'ok' });
      refreshProducts();
    } catch (e) {
      setActionMsg({ text: e.reason || e.message, kind: 'err' });
    }
  }

  async function handleAssignRole() {
    try {
      if (!roleAddr) throw new Error('Enter a wallet address');
      const c = await getContract();
      setRoleMsg({ text: 'Confirm the transaction...', kind: 'pending' });
      const tx = await c.assignRole(roleAddr, roleValue);
      await tx.wait();
      setRoleMsg({ text: `Role assigned. Tx: ${tx.hash.slice(0, 10)}...`, kind: 'ok' });
    } catch (e) {
      setRoleMsg({ text: e.reason || e.message, kind: 'err' });
    }
  }

  async function handleLookup() {
    try {
      if (!lookupId) throw new Error('Enter a product ID');
      const c = await getContract();
      setLookupMsg({ text: 'Fetching...', kind: 'pending' });
      const result = await c.getHistory(lookupId);
      if (result.length === 0) {
        setLookupMsg({ text: 'No history found for this ID', kind: 'err' });
        setHistory([]);
        return;
      }
      setLookupMsg({ text: `${result.length} record(s) found`, kind: 'ok' });
      setHistory(result.map(entry => ({
        status: entry.status,
        date: new Date(Number(entry.timestamp) * 1000).toLocaleString(),
        updatedBy: entry.updatedBy
      })));
    } catch (e) {
      setLookupMsg({ text: e.reason || e.message, kind: 'err' });
      setHistory([]);
    }
  }

  const roleLabel = isAdmin ? 'Admin' : (myRole !== null ? ROLE_NAMES[myRole] : '...');

  return (
    <div>
      <header>
        <div>
          <div className="eyebrow">On-chain ledger</div>
          <h1>Supply Chain Tracker</h1>
        </div>
        <div>
          <button className="connect" onClick={connectWallet} disabled={!!account}>
            {account ? 'Connected' : 'Connect Wallet'}
          </button>
          {account && (
            <div className="acct">
              {account.slice(0, 6)}...{account.slice(-4)}
              <div><span className={`role-badge role-${roleLabel}`}>{roleLabel}</span></div>
            </div>
          )}
        </div>
      </header>

      <div className="card">
        <h2>Contract</h2>
        <label>Deployed address (Sepolia)</label>
        <input className="addr-input" placeholder="0x..." value={contractAddr} onChange={e => setContractAddr(e.target.value)} />
      </div>

      <div className="tabs">
        <button className={`tab ${tab === 'dashboard' ? 'active' : ''}`} onClick={() => setTab('dashboard')}>Dashboard</button>
        <button className={`tab ${tab === 'actions' ? 'active' : ''}`} onClick={() => setTab('actions')}>My Actions</button>
        <button className={`tab ${tab === 'admin' ? 'active' : ''}`} onClick={() => setTab('admin')}>Admin</button>
        <button className={`tab ${tab === 'lookup' ? 'active' : ''}`} onClick={() => setTab('lookup')}>Lookup History</button>
      </div>

      {tab === 'dashboard' && (
        <div className="card">
          <h2>All Products</h2>
          {products.length === 0 ? (
            <div className="empty">No products registered yet, or connect wallet + enter contract address above.</div>
          ) : (
            <table>
              <thead>
                <tr><th>ID</th><th>Name</th><th>Status</th><th>Current Handler</th></tr>
              </thead>
              <tbody>
                {products.map(p => (
                  <tr key={p.id}>
                    <td>{p.id}</td>
                    <td>{p.name}</td>
                    <td><span className={`status-pill status-${p.status}`}>{p.status}</span></td>
                    <td>{p.handler.slice(0, 6)}...{p.handler.slice(-4)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          <button className="action secondary" onClick={refreshProducts}>Refresh</button>
        </div>
      )}

      {tab === 'actions' && (
        <div>
          <div className="card">
            <h2>Register Product (Manufacturer only)</h2>
            <div className="row">
              <div>
                <label>Product ID</label>
                <input type="number" placeholder="1" value={addId} onChange={e => setAddId(e.target.value)} />
              </div>
              <div>
                <label>Name</label>
                <input placeholder="Wireless Mouse" value={addName} onChange={e => setAddName(e.target.value)} />
              </div>
            </div>
            <button className="action" onClick={handleAddProduct}>Register Product</button>
            <div className={`msg ${addMsg.kind}`}>{addMsg.text}</div>
          </div>

          <div className="card">
            <h2>Update Status (Distributor / Retailer)</h2>
            <label>Product ID</label>
            <input type="number" placeholder="1" value={actionId} onChange={e => setActionId(e.target.value)} />
            <div className="row" style={{ marginTop: '12px' }}>
              <button className="action" onClick={handleMarkShipped}>Mark Shipped (Distributor)</button>
              <button className="action secondary" onClick={handleMarkDelivered}>Mark Delivered (Retailer)</button>
            </div>
            <div className={`msg ${actionMsg.kind}`}>{actionMsg.text}</div>
          </div>
        </div>
      )}

      {tab === 'admin' && (
        <div className="card">
          <h2>Assign Role (Admin only)</h2>
          <label>Wallet address</label>
          <input className="addr-input" placeholder="0x..." value={roleAddr} onChange={e => setRoleAddr(e.target.value)} />
          <label>Role</label>
          <select value={roleValue} onChange={e => setRoleValue(e.target.value)}>
            <option value="1">Manufacturer</option>
            <option value="2">Distributor</option>
            <option value="3">Retailer</option>
          </select>
          <button className="action" onClick={handleAssignRole}>Assign Role</button>
          <div className={`msg ${roleMsg.kind}`}>{roleMsg.text}</div>
        </div>
      )}

      {tab === 'lookup' && (
        <div className="card">
          <h2>Lookup History</h2>
          <label>Product ID</label>
          <input type="number" placeholder="1" value={lookupId} onChange={e => setLookupId(e.target.value)} />
          <button className="action" onClick={handleLookup}>Get History</button>
          <div className={`msg ${lookupMsg.kind}`}>{lookupMsg.text}</div>
          <div className="timeline">
            {history.map((entry, i) => (
              <div className="entry" key={i}>
                <div className="label">{entry.status}</div>
                <div className="meta">{entry.date} · {entry.updatedBy.slice(0, 6)}...{entry.updatedBy.slice(-4)}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
